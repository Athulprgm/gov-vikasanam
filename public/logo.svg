<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Emerald Green Gradient for Leaf / Jana ("J") -->
    <linearGradient id="emerald-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Gold/Amber Gradient for Development / Vikasam ("V") -->
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Platinum/White Soft Radial for Background Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#F8FAF9" stop-opacity="1" />
    </radialGradient>

    <!-- Smooth drop shadows for premium layering -->
    <filter id="shadow-main" x="-10%" y="-10%" width="128%" height="128%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042F1A" flood-opacity="0.12" />
    </filter>
    <filter id="shadow-accent" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#B45309" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Base Circular Plate (Premium Glass/Porcelain Look) -->
  <circle cx="256" cy="256" r="236" fill="url(#glow)" stroke="#E5EDE9" stroke-width="6" filter="url(#shadow-main)" />

  <!-- Innermost Decorative Circle -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3" />

  <g transform="translate(10, 5)">
    <!-- 1. The Emerald Green Leaf (Representing "Jana" - People & Nature - stylized "J") -->
    <path d="M 226,105 
             C 140,105 76,175 76,270 
             C 76,365 142,420 226,420 
             C 234,420 240,414 240,406 
             C 240,398 234,392 226,392 
             C 160,392 112,345 112,270 
             C 112,195 160,133 226,133 
             C 234,133 240,127 240,119 
             C 240,111 234,105 226,105 Z" 
          fill="url(#emerald-grad)" />

    <!-- 2. The Gold Upward Swooping Arrow (Representing "Vikasam" - Development & Infrastructure - stylized "V") -->
    <path d="M 186,325 
             C 202,365 226,396 256,396 
             C 286,396 352,260 396,120 
             L 336,145 
             L 348,175 
             C 320,265 272,352 254,352 
             C 238,352 224,340 212,310 
             C 208,302 198,300 192,305 
             C 186,310 182,317 186,325 Z" 
          fill="url(#gold-grad)" 
          filter="url(#shadow-accent)" />

    <!-- 3. Sparkle / Star of Kerala Prosperity -->
    <path d="M 396,90 
             C 396,100 400,104 410,104 
             C 400,104 396,108 396,118 
             C 396,108 392,104 382,104 
             C 392,104 396,100 396,90 Z" 
          fill="#F59E0B" />
  </g>
</svg>
